<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.35"/>

  <!-- Large decorative index card (background, right side) -->
  <g transform="translate(720, 100)" opacity="0.08">
    <path d="M0 24 C0 10.7 10.7 0 24 0 L280 0 L380 100 L380 406 C380 419.3 369.3 430 356 430 L24 430 C10.7 430 0 419.3 0 406 Z" fill="#FFFFFF"/>
    <path d="M280 0 L280 76 C280 89.3 290.7 100 304 100 L380 100 Z" fill="#3B82F6"/>
  </g>

  <!-- Icon mark -->
  <g transform="translate(100, 200)">
    <rect width="64" height="64" rx="14" fill="#1D4ED8"/>
    <g transform="translate(14, 9)">
      <path d="M0 3.5 C0 1.6 1.6 0 3.5 0 L23 0 L36 13 L36 42.5 C36 44.4 34.4 46 32.5 46 L3.5 46 C1.6 46 0 44.4 0 42.5 Z" fill="#FFFFFF" opacity="0.95"/>
      <path d="M23 0 L23 9.5 C23 11.4 24.6 13 26.5 13 L36 13 Z" fill="#93C5FD"/>
      <rect x="5" y="19" width="14" height="2" rx="1" fill="#1D4ED8" opacity="0.3"/>
      <rect x="5" y="24" width="26" height="2" rx="1" fill="#1D4ED8" opacity="0.2"/>
      <rect x="5" y="29" width="20" height="2" rx="1" fill="#1D4ED8" opacity="0.15"/>
    </g>
  </g>

  <!-- "CaseDex" wordmark -->
  <text x="180" y="252" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="56" letter-spacing="-0.5">
    <tspan fill="#F8FAFC">Case</tspan><tspan fill="#3B82F6">Dex</tspan>
  </text>

  <!-- Accent line -->
  <rect x="100" y="280" width="56" height="3" rx="1.5" fill="#3B82F6"/>

  <!-- Tagline -->
  <text x="100" y="320" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="24" fill="#94A3B8" letter-spacing="0.2">
    Every case, every hearing — in one place.
  </text>

  <!-- Subtitle -->
  <text x="100" y="360" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#64748B">
    Structured case workspace for legal professionals
  </text>

  <!-- Domain -->
  <text x="100" y="540" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="16" fill="#475569">
    casedex.app
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="622" width="1200" height="8" fill="#1D4ED8"/>
</svg>
