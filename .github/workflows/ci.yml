name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: casedex_test
          MYSQL_USER: casedex
          MYSQL_PASSWORD: testing
          MYSQL_ROOT_PASSWORD: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, mysql, redis, bcmath, intl, gd, zip
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare env
        run: cp .env.example .env && php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: casedex_test
          DB_USERNAME: casedex
          DB_PASSWORD: testing
          REDIS_HOST: 127.0.0.1
          QUEUE_CONNECTION: sync
        run: php artisan test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://casedex.app
          NEXT_PUBLIC_APP_URL: https://casedex.app
        run: pnpm build

  e2e:
    name: Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: casedex
          MYSQL_USER: casedex
          MYSQL_PASSWORD: casedex
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      # Laravel, served behind nginx on :8080 exactly like production.
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: casedex
      DB_USERNAME: casedex
      DB_PASSWORD: casedex
      REDIS_HOST: 127.0.0.1
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SESSION_DRIVER: database
      MAIL_MAILER: smtp
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 1025
      FILESYSTEM_DISK: local
      REGISTRATION_MODE: invite
      E2E_ADMIN_EMAIL: e2e-admin@example.test
      E2E_ADMIN_PASSWORD: E2e#Admin2026pass
      E2E_BASE_URL: http://localhost:8080
      E2E_MAILHOG_URL: http://localhost:8025

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, mysql, redis, bcmath, intl, gd, zip
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Start the backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env && php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --class=E2eSeeder --force
          php artisan serve --host=127.0.0.1 --port=8000 > ../backend.log 2>&1 &

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build and start the frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_APP_URL: http://localhost:8080
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > ../frontend.log 2>&1 &

      - name: Route through nginx
        run: |
          sudo cp .github/e2e/nginx.conf /etc/nginx/conf.d/casedex-e2e.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t && sudo systemctl restart nginx
          for i in $(seq 1 60); do curl -sf http://localhost:8080/login > /dev/null && curl -sf http://localhost:8080/api/v1/countries > /dev/null && break; sleep 2; done
          curl -sf http://localhost:8080/api/v1/countries > /dev/null

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: frontend
        run: pnpm exec playwright test

      - name: Keep the report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend.log
            frontend.log
            backend/storage/logs
          retention-days: 7

  deploy:
    name: Deploy to Production
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/casedex
            bash infra/deploy.sh redeploy
